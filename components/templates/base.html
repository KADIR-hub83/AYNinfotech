        $.fn.jQuerySimpleCounter = function (options) {
            var settings = $.extend({
                start: 0,
                end: 100,
                easing: 'swing',
                duration: 400,
                complete: ''
            }, options);

            var thisElement = $(this);

            $({ count: settings.start }).animate({ count: settings.end }, {
                duration: settings.duration,
                easing: settings.easing,
                step: function () {
                    var mathCount = Math.ceil(this.count);
                    thisElement.text(mathCount);
                },
                complete: settings.complete
            });
        };

        $(document).ready(function () {
            $('a[href^=\\#]').bind('click', function (e) {
                e.preventDefault();

                var target = $(this).attr("href");


                $('html, body').stop().animate({
                    scrollTop: $(target).offset().top
                }, 600, function () {
                    location.hash = target;
                });

                return false;
            });
        });

        $(window).scroll(function () {
            var scrollDistance = $(window).scrollTop();
            $('.page-section').each(function (i) {
                if ($(this).position().top <= scrollDistance) {
                    $('.navigation a.active').removeClass('active');
                    $('.navigation a').eq(i).addClass('active');
                }
            });
        }).scroll();

        $(window).scroll(function () {

    <script>
        $(document).ready(function () {
            $('.countryCode').val("1");
        })

        $(document).on('change', '.countryCode', function () {
            let selected_code = $('option:selected', this).val()
            let selected_country = $('option:selected', this).text()

            $('.country_code').each(function () {
                $(this).val(["+" + selected_code, selected_country])
            })

            $('.countryCode').each(function () {
                $(this).select().val(selected_code)
            })

            $('.country-code').each(function () {
                $(this).html('+' + selected_code);
            })
        });

        $(document).on('keypress', '#phone', function (event) {
            let ASCIICode = (event.which) ? event.which : event.keyCode;
            if (ASCIICode > 31 && (ASCIICode < 48 || ASCIICode > 57))
                return false;
            return true;
        });

        $(document).on('keypress', '#name', function (event) {
            let ASCIICode = (event.which) ? event.which : event.keyCode;
            if ((ASCIICode > 96 && ASCIICode < 123) || (ASCIICode > 64 && ASCIICode < 91) || ASCIICode == 32)
                return true;
            return false;
        });
    </script>
